# target path in your repo: mosquitto/mosquitto.conf
#
# Not used until Phase 5 — included in docker-compose.yml now so the broker
# is already running when you get there. Wide open, local-only dev config;
# do NOT use this as-is on anything internet-reachable.

listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
